<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Secure Login Code</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #1e293b; text-align: center;">Secure Login</h2>
        <p style="color: #475569; font-size: 16px;">Hi {{ username }},</p>
        <p style="color: #475569; font-size: 16px;">Here is your verification code to sign in to {{ project_name }}:</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <span style="display: inline-block; background-color: #e0e7ff; color: #4f46e5; font-size: 32px; font-weight: bold; letter-spacing: 5px; padding: 15px 30px; border-radius: 8px;">
                {{ otp }}
            </span>
        </div>
        
        <p style="color: #475569; font-size: 16px;">This code will expire in {{ expiry_minutes }} minutes.</p>
        
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 30px 0;">
        <p style="color: #94a3b8; font-size: 12px; text-align: center;">&copy; {{ year }} {{ project_name }}. All rights reserved.</p>
    </div>
</body>
</html>
